claims:
- id: abs-fp32-over-cache
  kind: computation
  passage: First, arithmetic on the runtime's published byte format shows that full-precision weights
    need 7.24 times the console's weight cache and four-bit quantisation still leaves the model at 1.02
    times the cache, so 0.87 MB per token must be streamed; of the sixteen combinations of the runtime's
    four techniques, 2 reach 0.4 tokens per second, three techniques are individually necessary, and on
    the 32 MB revision of the console none runs.
  evidence:
    file: simulation/output/results.json
    run_id: extensibility
    pointer: /lattice/fp32_over_cache
    reported: '7.24'
    units: multiple of the 48 MB weight cache
    conditions: published byte format of the runtime, 91.1 million parameters, 48 MB weight cache, 8 MB/s
      storage bandwidth, scalar rate calibrated to the full stack
    decimals: 2
