      the 24-layer hybrid of grouped-query attention and a Mamba2 branch in parallel, the 333 MHz MIPS
      CPU and about 0.5-0.6 tokens per second on a PSP-3000. The Hugging Face model card (tiiuae/Falcon-H1-Tiny-90M-Instruct)
      gives 90M parameters and a hybrid Transformers + Mamba architecture; the Mamba abstract (arXiv:2312.00752)
      describes selective state-space models.
