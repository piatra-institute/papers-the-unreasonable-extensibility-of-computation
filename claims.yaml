  passage: In mathematical programming between 2001 and 2020, hardware improved about 20-fold while algorithms
    improved about 9-fold for linear programming and 50-fold for mixed-integer programming [@koch2022].
  evidence:
    citation_id: koch2022
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1016/j.ejco.2022.100031; OpenAlex abstract: hardware about 20 times faster,
      algorithms improved about nine-fold for LP and around 50 for MILP.'
- id: koch-quote
  kind: source
  passage: 'Koch et al. note that their factors "considerably underestimate the progress made on the algorithmic
    side: many problem instances can nowadays be solved within seconds, which the old codes are not able
    to solve within any reasonable time."'
  evidence:
    citation_id: koch2022
    locator: Abstract
    verified: true
    verification_note: The quoted clause is verbatim in the OpenAlex abstract.
- id: wolpert
  kind: source
  passage: No algorithm outperforms another averaged over all problems [@wolpert1997], so every claim
    here is specific to a task family and a distribution.
  evidence:
    citation_id: wolpert1997
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1109/4235.585893; OpenAlex abstract: for any algorithm, elevated performance
      over one class of problems is offset by performance over another.'
- id: piccinini
  kind: source
  passage: The objection that any physical process can be interpreted as computing anything is answered
    by the mechanistic account, in which a system computes in virtue of its causal organisation [@piccinini2007]
    and what makes something a computer depends on how its states are manipulated [@piccinini2008].
  evidence:
    citation_id: piccinini2007
    locator: Abstract
    verified: true
    verification_note: DOI 10.1086/522851 and 10.1111/j.1468-0114.2008.00309.x; the abstracts assimilate
      computational explanation to mechanistic explanation and state that which functions a system computes
      depends on its mechanistic properties.
- id: guttenbrunner
  kind: source
  passage: Emulation can substitute partly for a surviving toolchain, with a fidelity that can be measured
    [@guttenbrunner2012].
  evidence:
    citation_id: guttenbrunner2012
    locator: Abstract
    verified: true
    verification_note: DOI 10.1145/2180868.2180876; the abstract presents a framework and tests assessing
      how far emulation preserves the original characteristics of digital objects.
- id: fixed-hardware
  kind: definition
  passage: Here *fixed hardware* means that the architecture, clock ceiling, memory and storage capacities,
    bandwidths, peripherals and power envelope are held constant while the loaded information varies.
  rationale: Stipulates what is held constant so that software-driven change in capability is well defined;
    loaded state is explicitly allowed to vary.
- id: capability-set
  kind: definition
  passage: Let $H$ be the fixed hardware, $p$ an executable artifact including code, trained parameters,
    tables, indexes and the runtime, $Q(p,H,\tau)$ the task quality, $R(p,H,\tau)$ the vector of resources
    used, and $B$ a budget vector.
  rationale: Introduces the variables of the feasible capability set; capability is a relation among machine,
    artifact, task, budget and quality threshold, indexed by the date through K_t.
- id: frontiers
  kind: definition
  passage: A capability is known when an implementation has been described, accessible when the code,
    toolchain, parameters and expertise to run it can be obtained, and deployed when it runs on the device.
  rationale: Stipulative definitions of the three nested frontiers used in the third result.
- id: calibration
  kind: assumption
  passage: The scalar arithmetic rate is solved so that the full four-technique stack reproduces the reported
    throughput, which fixes it at 33.3 million multiply-accumulate pairs per second; every other value
    below is a prediction from that calibration.
  rationale: The one free parameter of the lattice arithmetic is fitted to the reported throughput; every
    other lattice value is a prediction conditional on this fit.
- id: bandwidth
  kind: assumption
  passage: The storage bandwidth is stipulated at 8 MB per second and varied in a sensitivity analysis.
  rationale: Memory-stick bandwidth is not documented by the runtime; the necessity verdict is reported
    under a sweep of 4-20 MB/s.
- id: hazard-model
  kind: assumption
  passage: Give each component an annual hazard of becoming unrunnable and an annual rate of being restored.
  rationale: Independent per-component hazard and revival rates are modelling assumptions; the stated
    values are not measured, as the falsification section says.
- id: uncomputable-gap
  kind: interpretation
  passage: The difference between the two sets is uncomputable.
  rationale: Follows from the cited results on Kolmogorov complexity, Rice's theorem and Blum's speed-up
    theorem; it is an argument, not a computation.
- id: fourteen-fail
  kind: interpretation
  passage: 'The ablation can also be run: the fourteen configurations the lattice predicts should fail
    should fail, and the two it predicts should run should reach the predicted throughput.'
  rationale: 16 subsets (/lattice/supported/n_subsets) minus 2 viable (/lattice/supported/n_viable) leaves
    fourteen predicted failures; the count is derived from stored fields.
- id: invisible-explains
  kind: interpretation
  passage: This explains why a machine's practical capability can remain unchanged for years while the
    literature reports steady progress.
  rationale: Interpretive reading of the invisible-share result for the gap between reported progress
    and experienced capability.
- id: old-new
  kind: interpretation
  passage: Old hardware with new software outperforms new hardware with old software only on problems
    initially far out of reach for both.
  rationale: Summarises the overtaking comparison across the three regimes; holds within the calibrated
    model only.
- id: preservation
  kind: interpretation
  passage: Preserving a computational capability is therefore far more demanding than preserving a working
    device.
  rationale: Conclusion drawn from the 41- and 201-year component lives against the 27.8-year interval.
- id: deployment-extensibility
  kind: interpretation
  passage: The console demonstrates extensibility of deployment; development cost per use falls only when
    amortised over many deployments, which is a separate claim.
  rationale: Scopes the result to deployment cost, distinguishing it from the cost of training the parameters
    elsewhere.
- id: closing
  kind: interpretation
  passage: A statement that a machine can perform a task is a statement about a machine, an artifact,
    a task, a budget, a quality threshold and a date.
  rationale: 'The paper''s thesis restated: capability claims are relative to artifact, task, budget,
    threshold and date.'
