- id: abs-deployable-5
  kind: computation
  passage: Third, deployable capability requires every component of a software stack to remain runnable,
    so it saturates at 0.43 of known capability for a five-component stack; for such a stack to last as
    long as the mean interval between improvements in its field, each component would need a mean life
    of 201 years.
  evidence:
    file: simulation/output/results.json
    run_id: extensibility
    pointer: /decay/by_depth/3/ratio_at_40
    reported: '0.43'
    units: deployable share of known at 40 years
    conditions: hazard 0.03 a year, revival 0.12 a year, six arrivals a year, 60-year horizon, seed 20260904;
      depth 5
    decimals: 2
