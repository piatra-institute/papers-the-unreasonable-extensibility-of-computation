abstract: A handheld games console released in 2004 can now generate text locally. A published runtime
  runs a 90-million-parameter model on a Sony PSP with 64 MB of memory and a 333 MHz processor, at about
  0.55 tokens per second, with no network connection. The hardware is unchanged; what changed is the available
  software and trained parameters. We treat capability as a relation among a machine, an artifact, a task,
  a budget and a quality threshold, so the set of tasks a fixed machine can perform depends on the date.
  Three results follow. First, arithmetic on the runtime's published byte format shows that full-precision
  weights need 7.24 times the console's weight cache and four-bit quantisation still leaves the model
  at 1.02 times the cache, so 0.87 MB per token must be streamed; of the sixteen combinations of the runtime's
  four techniques, 2 reach 0.4 tokens per second, three techniques are individually necessary, and on
  the 32 MB revision of the console none runs. Second, in a model calibrated to a census of 113 algorithm
  families, between 0.83 and 0.89 of improvement events change no capability, and the burstiness of capability
  crossings relative to efficiency gains rises from 0.84 to 1.67 as the budget becomes more restrictive.
  Third, deployable capability requires every component of a software stack to remain runnable, so it
  saturates at 0.43 of known capability for a five-component stack; for such a stack to last as long as
  the mean interval between improvements in its field, each component would need a mean life of 201 years.
web_blurb: A 2004 games console can now run a small language model because of software developed two decades
  later. Treating capability as a relation among machine, artifact, task, budget and date, three models
  show which techniques the capability depends on, why steady efficiency gains produce sporadic capability
  jumps, and why deployable capability decays as software stacks deepen.
