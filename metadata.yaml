abstract: "A handheld games console from 2004 now generates text locally. A published runtime puts a 90-million-parameter hybrid attention and state-space model on a Sony PSP with 64 MB of memory and a 333 MHz processor, at about 0.55 tokens per second, with the weights on a memory card and no network. The processor did not change. What changed is the stock of representations, algorithms, runtimes, and trained parameters that can be brought to it. This paper takes that observation and computes with it. Capability is a relation among a machine, an artifact, a task, a budget, and a quality threshold, and the set of tasks a fixed machine can perform is therefore indexed by a date. Three results follow. The first is arithmetic on the byte format the runtime publishes, with one free parameter solved from the one throughput figure it reports, which leaves the rest as prediction: full-precision weights need 7.24 times the console's weight cache, four-bit block quantisation reduces that by 7.11 and still leaves the model at 1.02 of the cache, so the residual 0.87 MB per token must come off the card, and the capability is a conjunction. Of the sixteen subsets of the four techniques the runtime uses, 2 reach a 0.4 tokens-per-second floor, three techniques are individually necessary, the fourth buys speed rather than feasibility, and on the 32 MB revision of the same console 0 of 16 subsets run at all. Compression also relocates the constraint rather than removing it: at or above 6 bits the system is storage-bound and at or below 5 bits it is arithmetic-bound, so from the format in use a perfect representation would buy 1.06 times more speed and nothing else. The second result concerns why continuous improvement looks like discontinuous capability. Calibrating a family-improvement distribution to four published summary statistics of a 113-family census and putting a multidimensional budget over it, between 0.83 and 0.89 of all improvement events change no capability predicate at all, and the burstiness of capability crossings relative to the burstiness of the efficiency gains that cause them rises from 0.84 to 1.67 as the budget binds harder, with the concentration of crossings in the top decile of families rising from 0.24 to 0.41 alongside it. Amplification is real and it is conditional, and where the budget barely binds there is none. In the most demanding regime the fixed device with current software overtakes a device with 10 times its budget running frozen software in year 25. The third result is the one that cuts against the first two. Known capability accumulates; deployable capability requires every component of a stack to remain runnable at once, so it saturates rather than growing, at 0.43 of known for a five-component stack against 0.83 for a single component, and it turns over and falls to 0.39 of its peak when interest wanes. For a five-deep stack to survive as long as the mean interval between improvements in its own field, each component would have to last 201 years. The machine is the easy part to keep."
